<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madu Darts — Detection</title>
<style>
  :root { color-scheme: dark; --bg:#121416; --panel:#1c1f23; --line:#2b3036; --fg:#e6e8ea; --muted:#8a9199;
          --pass:#3cc85a; --warn:#f0c030; --fail:#e64646; --none:#6b7280; --accent:#3aa0ff; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; white-space:nowrap; }
  header nav { display:flex; gap:8px; align-items:center; margin-left:auto; }
  .pill { padding:4px 12px; border-radius:999px; font-weight:700; font-size:13px; color:#111; background:var(--none); text-transform:lowercase; }
  .pill.throw { background:var(--pass); }
  .pill.takeout, .pill.takeoutInProgress { background:var(--warn); }
  .pill.stopped, .pill.calibrationRequired { background:var(--fail); color:#fff; }
  .pill.standby { background:#5b6bd6; color:#fff; }
  #conn { font-size:12px; color:var(--muted); }
  #conn.ws { color:var(--pass); }
  main { padding:16px; display:grid; gap:16px; grid-template-columns: minmax(320px, 560px) 1fr; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  .strip { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .hit { background:#0f1114; border:1px solid var(--line); border-radius:8px; padding:12px; text-align:center; min-height:84px; }
  .hit b { display:block; font-size:28px; line-height:1.1; font-weight:800; }
  .hit small { color:var(--muted); font-size:11px; }
  .hit.empty b { color:#3a4048; }
  .hit.filled { border-color:var(--accent); }
  svg#board { width:100%; height:auto; display:block; background:#0b0d0f; border-radius:8px; }
  .dot { fill:#3aa0ff; stroke:#fff; stroke-width:1.2; }
  .dot-label { fill:#fff; font: 700 9px system-ui, sans-serif; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .cams { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .cam { background:#0f1114; border:1px solid var(--line); border-radius:8px; padding:10px; display:flex; align-items:center; gap:10px; }
  .motion-tile { width:18px; height:18px; border-radius:4px; background:#4b5563; border:1px solid #111; flex:none; }
  .motion-tile.idle { background:#4b5563; }
  .motion-tile.motion, .motion-tile.settling { background:#e6c200; }
  .motion-tile.stable { background:#3cc85a; }
  .motion-tile.takeout { background:#e64646; }
  .cam small { color:var(--muted); display:block; }
  button, a.btn { background:#2a2f36; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; text-decoration:none; display:inline-block; }
  button:hover, a.btn:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#06121f; border-color:transparent; font-weight:700; }
  button.danger { border-color:#5a2a2a; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #log { font: 12px/1.5 ui-monospace, Consolas, monospace; color:var(--muted); margin:0; max-height:220px; overflow:auto; white-space:pre; }
  #warn { color:var(--warn); font-size:12px; min-height:16px; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; }
  .hist-row { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .hist-row:last-child { border-bottom:0; }
  .hist-row .idx { color:var(--muted); width:2.2em; flex:none; }
  .hist-row .segs { font-weight:700; letter-spacing:.02em; }
  .hist-row a { color:var(--accent); font-size:12px; }
  .hist-actions { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
</style>
</head>
<body>
<header>
  <h1>Madu Darts · Detection</h1>
  <span class="pill" id="status">—</span>
  <span id="event" style="color:var(--muted);font-size:12px"></span>
  <span id="conn">connecting…</span>
  <nav>
    <a class="btn" href="/" id="calibrate">Calibrate</a>
    <button id="toggle" class="primary" title="Start/Stop detection. Start takes the current Board as empty.">Start</button>
    <button id="reset" class="danger" title="Clear the Turn and take the current Board as empty (keeps Calibration).">Reset</button>
    <button id="capture" title="Freeze cam frames + state into /api/captures (also auto-fires on the 3rd Hit).">Capture</button>
  </nav>
</header>
<main>
  <section class="panel">
    <h2>Board</h2>
    <svg id="board" viewBox="-200 -200 400 400" aria-label="virtual dartboard"></svg>
    <div class="meta" id="meta"></div>
  </section>
  <div style="display:grid;gap:16px;align-content:start">
    <section class="panel">
      <h2>Turn</h2>
      <div class="strip" id="strip"></div>
      <div id="warn"></div>
    </section>
    <section class="panel">
      <h2>Vision</h2>
      <div class="cams" id="cams"></div>
    </section>
    <section class="panel">
      <h2>History</h2>
      <div class="hist-actions">
        <span class="meta" id="hist-meta">0 visits</span>
        <button id="hist-refresh" type="button">Refresh</button>
        <button id="hist-clear" type="button" class="danger">Clear</button>
      </div>
      <div id="history"></div>
    </section>
    <section class="panel">
      <h2>Events</h2>
      <pre id="log"></pre>
    </section>
  </div>
</main>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const api = async (method, url, body) => {
    const res = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.detail || res.statusText), { data });
    return data;
  };

  // --- virtual Board (WDF radii, 20 at top, clockwise) ---
  const R = { ib: 6.35, ob: 15.9, ti: 99.4, to: 107.4, di: 162.0, do: 170.0, num: 186 };
  const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const pt = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; };
  const wedge = (r0, r1, a0, a1) => {
    const [x0, y0] = pt(r1, a0), [x1, y1] = pt(r1, a1), [x2, y2] = pt(r0, a1), [x3, y3] = pt(r0, a0);
    return `M${x0},${y0} A${r1},${r1} 0 0 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 0 0 ${x3},${y3} Z`;
  };
  let dots;
  function buildBoard() {
    const svg = $('#board'); svg.innerHTML = '';
    svg.appendChild(el('circle', { cx: 0, cy: 0, r: 198, fill: '#161a1e' }));
    SECTORS.forEach((n, i) => {
      const a0 = i * 18 - 9, a1 = a0 + 18, dark = i % 2 === 0;
      const single = dark ? '#1f2225' : '#e8e2d2', ring = dark ? '#c8322e' : '#2e8b3f';
      svg.appendChild(el('path', { d: wedge(R.ob, R.ti, a0, a1), fill: single }));
      svg.appendChild(el('path', { d: wedge(R.ti, R.to, a0, a1), fill: ring }));
      svg.appendChild(el('path', { d: wedge(R.to, R.di, a0, a1), fill: single }));
      svg.appendChild(el('path', { d: wedge(R.di, R.do, a0, a1), fill: ring }));
      const [tx, ty] = pt(R.num, a0 + 9);
      const t = el('text', { x: tx, y: ty, fill: '#c9ced4', 'font-size': 13, 'font-weight': 700, 'text-anchor': 'middle', 'dominant-baseline': 'central' });
      t.textContent = n; svg.appendChild(t);
    });
    svg.appendChild(el('circle', { cx: 0, cy: 0, r: R.ob, fill: '#2e8b3f' }));
    svg.appendChild(el('circle', { cx: 0, cy: 0, r: R.ib, fill: '#c8322e' }));
    [R.ob, R.ti, R.to, R.di, R.do].forEach(r => svg.appendChild(el('circle', { cx: 0, cy: 0, r, fill: 'none', stroke: '#9aa3ad', 'stroke-width': 0.6 })));
    dots = el('g', { id: 'dots' }); svg.appendChild(dots);
  }

  // --- rendering ---
  let state = null;
  const logLines = [];
  let lastKey = '';
  let lastHistoryCount = -1;

  async function loadHistory() {
    try {
      const h = await api('GET', '/api/history');
      const root = $('#history'); root.innerHTML = '';
      const visits = (h.visits || []).slice().reverse().slice(0, 12);
      $('#hist-meta').textContent = `${h.count || 0} visit${(h.count || 0) === 1 ? '' : 's'}` + (h.current ? ' · Turn open' : '');
      if (h.current && h.current.segmentNames && h.current.segmentNames.length) {
        const row = document.createElement('div'); row.className = 'hist-row';
        row.innerHTML = `<span class="idx">now</span><span class="segs">${h.current.segmentNames.join(' · ')}</span>` +
          (h.current.captureId ? ` <a href="/api/captures/${h.current.captureId}/0.jpg" target="_blank">cam0</a>` : '');
        root.appendChild(row);
      }
      for (const v of visits) {
        const row = document.createElement('div'); row.className = 'hist-row';
        const segs = (v.segmentNames || []).join(' · ') || '—';
        const cap = v.captureId ? ` <a href="/api/captures/${v.captureId}/0.jpg" target="_blank" title="${v.captureId}">cams</a>` : '';
        row.innerHTML = `<span class="idx">#${v.index}</span><span class="segs">${segs}</span>${cap}`;
        root.appendChild(row);
      }
      if (!visits.length && !(h.current && h.current.segmentNames && h.current.segmentNames.length)) {
        root.innerHTML = '<div class="meta">No sealed visits yet — throw a Turn, then takeout.</div>';
      }
      lastHistoryCount = h.count || 0;
    } catch (e) { $('#hist-meta').textContent = e.message; }
  }

  function render(st) {
    state = st;
    const running = !!st.running;
    const accepted = st.madu && st.madu.calibrationAccepted;
    const pill = $('#status');
    let cls = st.status;
    if (!accepted) cls = 'calibrationRequired';
    else if (!running) cls = 'stopped';
    else if (st.madu && st.madu.standby) cls = 'standby';
    pill.className = `pill ${cls}`;
    pill.textContent = !accepted ? 'calibration required' : (!running ? 'stopped' : (st.madu && st.madu.standby ? 'standby' : st.status));
    $('#event').textContent = `event: ${st.event}`;
    $('#toggle').textContent = running ? 'Stop' : 'Start';
    $('#toggle').className = running ? '' : 'primary';
    $('#toggle').disabled = !accepted;
    $('#reset').disabled = !accepted;
    $('#warn').textContent = !accepted ? 'Calibration not accepted — go to Calibrate first.' : (st.cameras && st.cameras.error ? `Camera error: ${st.cameras.error}` : '');

    const throws = st.throws || [];
    const strip = $('#strip'); strip.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const t = throws[i];
      const d = document.createElement('div');
      d.className = `hit ${t ? 'filled' : 'empty'}`;
      d.innerHTML = t ? `<b>${t.segmentName}</b><small>${t.bed} · ${t.method}</small>` : `<b>—</b><small>dart ${i + 1}</small>`;
      strip.appendChild(d);
    }
    dots.innerHTML = '';
    throws.forEach((t, i) => {
      const x = t.coordsX * R.do, y = -t.coordsY * R.do;
      dots.appendChild(el('circle', { class: 'dot', cx: x, cy: y, r: 7 }));
      const lab = el('text', { class: 'dot-label', x, y }); lab.textContent = i + 1; dots.appendChild(lab);
    });
    const hits = (st.madu && st.madu.hits) || [];
    $('#meta').textContent = hits.length
      ? hits.map((h, i) => `#${i + 1} ${h.madu.segment} (${h.madu.xMm}, ${h.madu.yMm}) mm · ${h.method} · spread ${h.madu.spreadMm} mm`).join('  |  ')
      : (st.madu && st.madu.bounceOuts && st.madu.bounceOuts.length ? `${st.madu.bounceOuts.length} bounce-out(s) this Turn` : '');

    const key = `${st.status}|${st.event}|${throws.length}|${running}`;
    if (key !== lastKey) {
      lastKey = key;
      const now = new Date().toLocaleTimeString();
      logLines.unshift(`${now}  ${st.status.padEnd(18)} ${st.event.padEnd(16)} throws=${throws.length}${throws.length ? '  ' + throws.map(t => t.segmentName).join(' ') : ''}`);
      logLines.length = Math.min(logLines.length, 40);
      $('#log').textContent = logLines.join('\n');
    }
    const histCount = st.madu && st.madu.historyCount;
    if (typeof histCount === 'number' && histCount !== lastHistoryCount) loadHistory();
  }

  let camSlots = [];
  function buildCams(config) {
    camSlots = config.slots.map(s => s.slot);
    const root = $('#cams'); root.innerHTML = '';
    for (const s of config.slots) {
      const d = document.createElement('div'); d.className = 'cam'; d.dataset.slot = s.slot;
      d.innerHTML = `<span class="motion-tile idle" data-tile></span><div><b>Cam ${s.slot}</b><small data-info>idle</small></div>`;
      root.appendChild(d);
    }
  }
  function renderMotion(m) {
    if (!m || !m.cams) return;
    for (const slot of camSlots) {
      const d = document.querySelector(`.cam[data-slot="${slot}"]`); if (!d) continue;
      const c = m.cams[String(slot)] || {};
      const phase = c.isTakeout ? 'takeout' : (c.phase || 'idle');
      $('[data-tile]', d).className = `motion-tile ${phase}`;
      $('[data-info]', d).textContent = m.enabled ? `${phase} · ${c.changedPixels || 0} px` : 'gated';
    }
  }

  // --- controls ---
  $('#toggle').onclick = async () => {
    try { await api('PUT', state && state.running ? '/api/stop' : '/api/start'); render(await api('GET', '/api/state')); }
    catch (e) { $('#warn').textContent = e.message; }
  };
  $('#reset').onclick = async () => { try { await api('POST', '/api/reset'); render(await api('GET', '/api/state')); await loadHistory(); } catch (e) { $('#warn').textContent = e.message; } };
  $('#capture').onclick = async () => {
    try {
      const pack = await api('POST', '/api/capture');
      $('#warn').textContent = `Captured ${pack.id} (${Object.keys(pack.frames || {}).length} cams)`;
      await loadHistory();
    } catch (e) { $('#warn').textContent = e.message; }
  };
  $('#hist-refresh').onclick = () => loadHistory();
  $('#hist-clear').onclick = async () => { try { await api('POST', '/api/history/clear'); await loadHistory(); render(await api('GET', '/api/state')); } catch (e) { $('#warn').textContent = e.message; } };

  // --- stream: WS first, polling fallback ---
  let ws = null, pollTimer = null;
  async function pollOnce() {
    try { render(await api('GET', '/api/state')); renderMotion(await api('GET', '/api/state/motion')); $('#conn').textContent = 'polling'; $('#conn').className = ''; }
    catch (e) { $('#conn').textContent = `service unreachable: ${e.message}`; $('#conn').className = ''; }
  }
  function startPolling() { if (!pollTimer) pollTimer = setInterval(pollOnce, 500); }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    try { ws = new WebSocket(`${proto}://${location.host}/api/events?motion=1`); } catch (e) { startPolling(); return; }
    ws.onopen = () => { stopPolling(); $('#conn').textContent = 'live (ws)'; $('#conn').className = 'ws'; };
    ws.onmessage = ev => { const msg = JSON.parse(ev.data); if (msg.type === 'state') render(msg.data); else if (msg.type === 'motion') renderMotion(msg.data); };
    ws.onclose = ws.onerror = () => { ws = null; startPolling(); setTimeout(connect, 3000); };
  }

  (async () => {
    buildBoard();
    try { buildCams(await api('GET', '/api/cams/config')); } catch (e) { /* cams panel stays empty */ }
    await pollOnce();
    await loadHistory();
    connect();
  })();
})();
</script>
</body>
</html>
